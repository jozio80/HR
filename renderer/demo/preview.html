<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>호롱 채용 워크스페이스 (미리보기)</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="lamp">🏮</span>
        <div>
          <h1>호롱랩스</h1>
          <p class="tagline">채용 워크스페이스</p>
        </div>
      </div>
      <div class="privacy-badge-mini"><span class="dot"></span> 100% 로컬 처리 · 네트워크 전송 없음</div>
      <button id="btn-new-position" class="primary full-width">+ 새 포지션</button>
      <div id="position-list" class="position-list"></div>
    </aside>

    <main class="main-area">
      <div id="empty-workspace" class="empty-workspace">
        <p>왼쪽에서 포지션을 선택하거나<br />"+ 새 포지션"으로 채용을 시작하세요.</p>
      </div>

      <div id="position-view" class="position-view hidden">
        <header class="position-header">
          <div>
            <h2 id="position-title"></h2>
            <p id="position-summary" class="hint"></p>
          </div>
          <div class="position-header-actions">
            <button id="btn-edit-position" class="secondary">조건 수정</button>
            <button id="btn-delete-position" class="link-btn danger">포지션 삭제</button>
          </div>
        </header>

        <nav class="tabs" id="tab-nav">
          <button class="tab-btn active" data-tab="sourcing">1. 소싱</button>
          <button class="tab-btn" data-tab="screening">2. 서류스크리닝</button>
          <button class="tab-btn" data-tab="interview">3. 면접</button>
          <button class="tab-btn" data-tab="offer">4. 합격통보</button>
          <button class="tab-btn" data-tab="onboarding">5. 온보딩</button>
        </nav>

        <section id="tab-sourcing" class="tab-panel"></section>
        <section id="tab-screening" class="tab-panel hidden"></section>
        <section id="tab-interview" class="tab-panel hidden"></section>
        <section id="tab-offer" class="tab-panel hidden"></section>
        <section id="tab-onboarding" class="tab-panel hidden"></section>
      </div>
    </main>
  </div>

  <div id="position-modal" class="modal hidden">
    <div class="modal-content">
      <button id="btn-close-position-modal" class="close-btn">✕</button>
      <h3 id="position-modal-title">새 포지션</h3>
      <label>직무명
        <input id="pm-title" type="text" placeholder="예: 백엔드 개발자 (3년 이상)" />
      </label>
      <label>필수 스킬 / 키워드 <span class="hint">(쉼표로 구분)</span>
        <textarea id="pm-required" rows="2" placeholder="예: Java, Spring Boot, MySQL"></textarea>
      </label>
      <label>우대 스킬 / 키워드 <span class="hint">(쉼표로 구분)</span>
        <textarea id="pm-preferred" rows="2" placeholder="예: AWS, Kafka"></textarea>
      </label>
      <label>최소 경력 연차
        <input id="pm-years" type="number" min="0" max="30" placeholder="예: 3" />
      </label>
      <button id="btn-save-position" class="primary full-width">저장</button>
    </div>
  </div>

  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <button id="btn-close-detail-modal" class="close-btn">✕</button>
      <h3 id="detail-filename"></h3>
      <div id="detail-body"></div>
    </div>
  </div>

  <footer class="footer">
    <span>호롱랩스 v0.3.0 (프로토타입 · 브라우저 미리보기)</span>
    <span>채점/생성 로직은 전부 규칙 기반이며, 최종 채용 판단은 반드시 사람이 검토해야 합니다.</span>
  </footer>

  <script src="scoring.browser.js"></script>
  <script src="interviewQuestions.browser.js"></script>
  <script src="emailTemplates.browser.js"></script>
  <script src="onboardingChecklist.browser.js"></script>
  <script src="positionStore.browser.js"></script>
  <script src="mock.js"></script>
  <script src="../app.js"></script>
</body>
</html>
